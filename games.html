<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Game</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #1f2a44;
      --muted: #5b6785;
      --accent: #2f6fed;
      --accent-dark: #1f54c4;
      --line: #dfe4f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      font-size: 18px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .back:hover { text-decoration: underline; }

    header { text-align: center; margin-bottom: 32px; }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin: 0 0 8px;
    }

    .subtitle { color: var(--muted); margin: 0; font-size: 1.1rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .game {
      font: inherit;
      text-align: left;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s, transform 0.15s;
    }

    .game:hover { border-color: var(--accent); transform: translateY(-2px); }
    .game:focus-visible { outline: 3px solid #9bb8f7; outline-offset: 2px; }

    .game .icon { font-size: 2rem; line-height: 1; }
    .game .name { font-size: 1.25rem; font-weight: 700; }
    .game .desc { color: var(--muted); font-size: 0.95rem; }

    .game .tag {
      align-self: flex-start;
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--bg);
      border-radius: 999px;
      padding: 2px 10px;
    }

    .message {
      text-align: center;
      color: var(--accent-dark);
      font-weight: 600;
      margin-top: 24px;
      min-height: 1.6em;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Back to welcome</a>

    <header>
      <h1>Choose a Game</h1>
      <p class="subtitle">Pick a topic to practice.</p>
    </header>

    <div class="grid">
      <button type="button" class="game" data-game="Past Participles">
        <span class="icon" aria-hidden="true">🃏</span>
        <span class="name">Past Participles</span>
        <span class="desc">go → gone, write → written</span>
        <span class="tag">Coming soon</span>
      </button>

      <button type="button" class="game" data-game="Conditionals">
        <span class="icon" aria-hidden="true">🔀</span>
        <span class="name">Conditionals</span>
        <span class="desc">If it rains, I will stay home.</span>
        <span class="tag">Coming soon</span>
      </button>

      <button type="button" class="game" data-game="Present & Progressive">
        <span class="icon" aria-hidden="true">⏱️</span>
        <span class="name">Present &amp; Progressive</span>
        <span class="desc">I eat. / I am eating.</span>
        <span class="tag">Coming soon</span>
      </button>

      <button type="button" class="game" data-game="Kitchen Vocabulary">
        <span class="icon" aria-hidden="true">🍳</span>
        <span class="name">Kitchen Vocabulary</span>
        <span class="desc">pan, spoon, oven, fridge</span>
        <span class="tag">Coming soon</span>
      </button>

      <button type="button" class="game" data-game="Phrasal Verbs">
        <span class="icon" aria-hidden="true">🧩</span>
        <span class="name">Phrasal Verbs</span>
        <span class="desc">pick up, turn off, look for</span>
        <span class="tag">Coming soon</span>
      </button>

      <button type="button" class="game" data-game="Prepositions">
        <span class="icon" aria-hidden="true">📍</span>
        <span class="name">Prepositions</span>
        <span class="desc">in, on, at, under, next to</span>
        <span class="tag">Coming soon</span>
      </button>
    </div>

    <p class="message" id="message" aria-live="polite"></p>
  </main>

  <script>
    // Placeholder: each game will link to its own page once built.
    const message = document.getElementById('message');
    document.querySelectorAll('.game').forEach(function (btn) {
      btn.addEventListener('click', function () {
        message.textContent = btn.dataset.game + ' is coming soon!';
      });
    });
  </script>
</body>
</html>
